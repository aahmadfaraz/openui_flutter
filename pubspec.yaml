name: openui_flutter
description: >-
  Render OpenUI Lang, the streaming generative UI language, as native Flutter
  widgets: layouts, tables, charts, forms, cards and icons, plus custom
  components.
version: 0.1.2
repository: https://github.com/aahmadfaraz/openui_flutter
issue_tracker: https://github.com/aahmadfaraz/openui_flutter/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^1.0.0
  flutter_lucide: ^1.57.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - generative-ui
  - ai
  - llm
  - widgets
  - chat
